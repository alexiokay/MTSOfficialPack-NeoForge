plugins {
    id "java"
    id "eclipse"
    id "idea"
    id "net.neoforged.moddev" version "1.0.21"
}

//Set file name.
version = "V25"
group = "minecrafttransportsimulator"
archivesBaseName = "MTS Official Pack"

//Options for Java version to compile to.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
compileJava {
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

repositories {
    mavenCentral()
}

//NeoForge configuration
neoForge {
    version = "21.1.80"

    runs {
        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        register("mtsofficialpack") {
            sourceSet(sourceSets.main)
        }
    }
}

//Specify dependencies.
dependencies {
    // No explicit minecraft dependency needed with NeoForge ModDev plugin
}

// Configure duplicate handling for jar task
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8" // Use the UTF-8 charset for Java compilation
}
